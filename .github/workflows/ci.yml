# Default PR/main gate: fmt, clippy, unit tests. No MySQL, no crash harness.
# Live capture / Gate 0 crash harness is lab-only (scripts/crash-harness/).
# Release binaries: .github/workflows/release.yml (Linux + Windows, no MySQL).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: >
          cargo clippy
          -p ce-stream-core
          -p ce-stream-mysql
          -p ce-stream-cli
          -p ce-stream-perf-sink
          --no-deps
          -- -D warnings

      - name: cargo test (unit, no MySQL)
        run: cargo test -p ce-stream-core -p ce-stream-mysql
