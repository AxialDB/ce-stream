# MVP discussion forms for GitHub default categories.
# Filenames must match category slugs (Settings → Discussions → Categories).
# Defaults after enabling Discussions: q-a, ideas, general, announcements, show-and-tell.
title: "[Question] "
body:
  - type: markdown
    attributes:
      value: |
        Ask how-to / usage questions here.

        **Bugs** → [Issues](https://github.com/AxialDB/ce-stream/issues) (Bug report template).
        **Security** → do not post here; see [SECURITY.md](https://github.com/AxialDB/ce-stream/blob/main/SECURITY.md).
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and what is unclear?
      placeholder: How do I configure include_tables for...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Config / CLI
        - MySQL capture / GTID
        - HTTP or stdout sink
        - Avro encoding
        - Library embed
        - Docs
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions (if relevant)
      description: ce-stream commit/tag and MySQL version
      placeholder: ce-stream main @ abc1234, MySQL 9.7
    validations:
      required: false
