title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Propose a feature or improvement.

        Maintainers may promote accepted ideas to Issues on the roadmap.
        **Bugs** → [Issues](https://github.com/AxialDB/ce-stream/issues).
  - type: textarea
    id: idea
    attributes:
      label: What do you want?
      description: Describe the use case and how ce-stream could help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other tools you looked at (optional).
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I understand v1 is MySQL 9.x and MongoDB 8.0+, and other DBs are deferred
          required: true
