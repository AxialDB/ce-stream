[package]
name = "ce-stream-cli"
description = "ce-stream command-line runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["cdc", "mysql", "mongodb", "postgresql", "cloudevents"]
categories = ["command-line-utilities", "database"]
rust-version.workspace = true

[[bin]]
name = "ce-stream"
path = "src/main.rs"

[dependencies]
base64 = { workspace = true }
ce-stream-core = { workspace = true }
ce-stream-mongo = { workspace = true }
ce-stream-mysql = { workspace = true }
ce-stream-postgres = { workspace = true }
mongodb = "3.9.1"
chrono = { workspace = true }
clap = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
