[package]
name = "ce-stream-cli"
description = "ce-stream command-line runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# mongodb 3.9, via ce-stream-mongo, requires Rust 1.88.
rust-version = "1.88"

[[bin]]
name = "ce-stream"
path = "src/main.rs"

[dependencies]
base64 = { workspace = true }
ce-stream-core = { workspace = true }
ce-stream-mongo = { workspace = true }
ce-stream-mysql = { workspace = true }
mongodb = "3.9.1"
chrono = { workspace = true }
clap = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
