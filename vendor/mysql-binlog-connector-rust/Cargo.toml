# Vendored from https://github.com/apecloud/mysql-binlog-connector-rust (f7cca8ec / 0.3.4).
# ce-stream patch: show binary log status (MySQL 9.x only). See PATCHES.md.

[package]
edition = "2021"
name = "ce-stream-mysql-binlog"
version = "0.1.0"
authors = ["Shicai Xu <chenglingsu@126.com>", "AxialDB"]
categories = ["database"]
description = "MySQL binlog connector fork for ce-stream. SHOW BINARY LOG STATUS for MySQL 8.4+ and 9.x. Based on apecloud/mysql-binlog-connector-rust."
keywords = ["mysql", "binlog", "connector"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/AxialDB/ce-stream"
homepage = "https://github.com/AxialDB/ce-stream"
readme = "PATCHES.md"

[lib]
name = "mysql_binlog_connector_rust"

[features]
default = []
rustls = ["dep:futures", "dep:futures-rustls", "dep:rustls"]
openssl-tls = ["dep:openssl", "dep:async-std-openssl"]

[dependencies]
byteorder = "1.4.3"
num_enum = "0.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.87"
serial_test = "3.1.1"
sha1 = "0.10.0"
sha2 = "0.10.6"
zstd = "0.13.2"
async-std = "1.12.0"
dotenv = "0.15.0"
url = "2.3.1"
percent-encoding = "2.3.1"
async-recursion = "1.0.2"
lazy_static = "1.4.0"
thiserror = "1.0.44"
mysql_common = "0.32.4"
base64 = "0.22.1"
log = "0.4.26"
socket2 = "0.6.1"
futures = { version = "0.3", optional = true }
futures-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", optional = true }
openssl = { version = "0.10", optional = true }
async-std-openssl = { version = "0.6", optional = true }
